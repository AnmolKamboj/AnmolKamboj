name: Generate space shooter

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  # Manual or nightly only. First push keeps the themed GIF;
  # run this after public contributions exist.

permissions:
  contents: write

concurrency:
  group: space-shooter
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          output-path: assets/space-shooter.gif
          strategy: random
          fps: "30"
          no-amend: "true"
          commit-message: "chore: refresh contribution space shooter"
