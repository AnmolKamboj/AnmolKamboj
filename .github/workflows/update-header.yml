name: Update dossier header

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/stats.json"
      - ".github/workflows/update-header.yml"

permissions:
  contents: write

concurrency:
  group: update-header
  cancel-in-progress: false

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh stats and header
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_stats.py

      - name: Commit header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.png assets/stats.json
          if git diff --staged --quiet; then
            echo "No header changes."
          else
            git commit -m "chore: refresh profile dossier stats"
            git push
          fi
